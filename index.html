<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>豪老師梗圖產生器</title>
<!-- link preview (Discord, LINE, Facebook, X): title, one line, and a sample meme -->
<meta name="description" content="高品質大字圖">
<meta name="theme-color" content="#6aa8f7">
<meta property="og:type" content="website">
<meta property="og:site_name" content="haomeme">
<meta property="og:title" content="豪老師梗圖產生器">
<meta property="og:description" content="高品質大字圖">
<meta property="og:url" content="https://lanternko.github.io/HaoMeme/">
<meta property="og:image" content="https://lanternko.github.io/HaoMeme/og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="梗圖範例：輪到你 教育我了？">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="fonts/woff2/hao-title-00.woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Page look follows the arammeta design system: dark charcoal canvas, flat
     surfaces split by hairlines, one soft blue accent, 8/12px corners. */
  :root {
    color-scheme: dark;
    --bg: #0a0b0d;
    --surface: #101114;
    --surface-raised: #1a1d21;
    --text: #e8eaed;
    --text-muted: #9aa0a6;
    --text-dim: #6b7280;
    --border: rgba(255, 255, 255, .09);
    --border-strong: rgba(255, 255, 255, .15);
    --accent: #6aa8f7;
    --offwhite: #e6e6e3;
    --accent-soft: #9cc6fb;
    --accent-on: #0b1a2e;
    --header-h: 56px;
    --r-sm: 8px;
    --r-md: 12px;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --font-ui: "Noto Sans TC", -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }

  /* header: wordmark on the left, the two export actions on the right */
  header { position: sticky; top: 0; z-index: 20; height: var(--header-h); background: var(--bg); border-bottom: 1px solid var(--border); }
  .rail { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
  header .rail { height: 100%; display: flex; align-items: center; gap: 16px; }
  .brand-title { margin: 0; font: 600 26px/1 "Outfit", var(--font-ui); letter-spacing: -.035em; white-space: nowrap; }
  .brand-a { font-weight: 500; color: var(--text-muted); }
  .brand-b { font-weight: 700; color: var(--accent); }
  .brand-sub { color: var(--text-dim); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #msg { color: var(--text-muted); font-size: 12px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; padding-top: 24px; padding-bottom: 32px; }
  .preview { position: sticky; top: calc(var(--header-h) + 24px); }
  .stage { position: relative; border-radius: var(--r-md); overflow: hidden; box-shadow: 0 0 0 1px var(--border); background: #000; }
  canvas { width: 100%; height: auto; display: block; }
  #cv { touch-action: none; }
  #ov { position: absolute; inset: 0; height: 100%; background: none; pointer-events: none; }
  .stage-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .stage-bar .note { margin: 0; }
  .stage-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .stage-btns button { padding: 6px 10px; font-size: 12px; }
  .note { margin: 6px 0 0; color: var(--text-muted); font-size: 12px; line-height: 1.5; }
  .note.dim { color: var(--text-dim); }

  /* right control column: template grid + tabbed card */
  .panel { display: flex; flex-direction: column; gap: 14px; }
  .tpl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tpl-grid button { padding: 12px 10px; font-size: 15px; font-weight: 700; letter-spacing: .02em; background: var(--surface);
                     border: 1px solid var(--border-strong); border-radius: var(--r-sm); color: var(--text-muted); }
  .tpl-grid button:hover { color: var(--text); background: var(--surface-raised); }
  .tpl-grid button.on, .tpl-grid button.on:hover { background: var(--offwhite); border-color: var(--offwhite); color: #111; }

  .card { border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--border); background: var(--surface-raised); }
  .tabs button { border: 0; border-radius: 0; background: none; padding: 12px 8px; font-size: 14px; font-weight: 700; color: var(--text-muted);
                 border-bottom: 2px solid transparent; }
  .tabs button:hover { background: rgba(255,255,255,.04); color: var(--text); }
  .tabs button.on, .tabs button.on:hover { background: var(--surface); color: var(--text); border-bottom-color: var(--accent); }
  .tab-body { padding: 18px 16px; }
  .tab-body[hidden] { display: none; }

  details.more { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  details.more summary { cursor: pointer; color: var(--text-muted); font-size: 12px; font-weight: 600; user-select: none; list-style: none;
                         display: flex; align-items: center; justify-content: space-between; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary::after { content: "▾"; font-size: 13px; transition: transform 150ms var(--ease); }
  details.more[open] summary::after { transform: rotate(180deg); }
  details.more[open] summary { color: var(--text); margin-bottom: 6px; }

  label { display: block; margin-top: 14px; color: var(--text-muted); font-size: 12px; font-weight: 600; }
  label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 400; font-size: 14px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; color: var(--text-muted); font-size: 12px; font-weight: 600; }
  .row > button { flex: 1; }
  .row.checks { gap: 8px 20px; flex-wrap: wrap; }
  .row.checks label.check { margin: 0; }
  small { display: block; margin-top: 8px; color: var(--text-dim); font-size: 12px; line-height: 1.5; }

  button { background: var(--surface-raised); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px 12px;
           font: 600 12px/1.25 var(--font-ui); cursor: pointer; transition: background 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease); }
  button:hover:not(:disabled) { border-color: var(--border-strong); background: #20242a; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); padding: 10px 14px; }
  button.primary:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* segmented control for left/right */
  .seg { display: flex; background: var(--surface-raised); border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border); }
  .seg button { flex: 1; border: 0; background: none; border-radius: 0; color: var(--text-muted); padding: 8px 12px; font-size: 13px; font-weight: 700; }
  .seg button:hover { background: none; color: var(--text); }
  .seg button.on, .seg button.on:hover { background: var(--offwhite); color: #111; }
  button svg { width: 15px; height: 15px; margin-right: 6px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  input[type=range] { display: block; width: 100%; margin: 8px 0 0; accent-color: var(--accent); }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }

  /* text box: a transparent textarea over a mirror that shows the colours */
  .ed-wrap { position: relative; }
  #ed, #edMirror { font: 700 20px/1.5 var(--font-ui); padding: 10px 12px; margin: 0;
                   white-space: pre-wrap; overflow-wrap: anywhere; letter-spacing: 0; border: 1px solid var(--accent); border-radius: var(--r-sm); }
  #ed { position: relative; z-index: 1; display: block; width: 100%; min-height: 84px; resize: none; overflow: hidden;
        background: transparent; color: transparent; caret-color: #fff; transition: border-color 120ms var(--ease); }
  #ed:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 35%, transparent); }
  #ed::selection { background: rgba(106, 168, 247, .4); color: transparent; }
  #edMirror { position: absolute; inset: 0; overflow: hidden; background: var(--bg); pointer-events: none; }
  .k-white { color: #fff; } .k-yellow { color: #ffe600; } .k-red { color: #ff4048; }
  .colors > span { flex: 1; }
  .colors button { flex: none; min-width: 44px; font-size: 14px; font-weight: 700; padding: 6px 10px; }
  /* phones: while typing, the colours ride just above the keyboard, clear of the
     system's 剪下 / 拷貝 / 貼上 menu that pops up next to the selection */
  #kbColors { position: fixed; left: 0; right: 0; top: 0; z-index: 60; margin: 0; gap: 8px;
    padding: 8px 16px; background: var(--surface-raised); border-top: 1px solid var(--border-strong); }
  #kbColors[hidden] { display: none; }
  #kbColors button { min-width: 56px; min-height: 40px; font-size: 16px; }
  #kbDone { margin-left: auto; background: var(--accent); border-color: var(--accent); color: var(--accent-on); font-size: 14px; min-width: 60px; }

  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .thumbs button { padding: 0; height: auto; aspect-ratio: 1 / 1; overflow: hidden; background: var(--surface-raised); border-color: var(--border); position: relative; }
  @media (hover: hover) { .thumbs button:hover { filter: brightness(1.15); } }
  /* The ring is drawn inside the tile, over the picture. Drawn outside (outline or
     shadow), iPhone Safari cut it off once a tapped tile was brightened. */
  .thumbs button.on::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--accent);
    border-radius: inherit; pointer-events: none; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; display: block; }
  .bgs { grid-template-columns: repeat(3, 1fr); }
  .bgs button { height: auto; aspect-ratio: 16 / 9; }
  .bgs canvas { height: 100%; }
  /* the last tile holds the uploaded picture; dashed with a clear + icon while empty */
  .thumbs button.up { background: transparent; border: 1px dashed var(--text-dim); color: var(--text-muted);
                      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; }
  .thumbs button.up:not(.has)::before { content: "+"; font-size: 20px; line-height: 1; font-weight: 400; color: var(--text-muted); }
  .thumbs button.up:not(.has)::after { content: "上傳"; font-size: 10px; color: var(--text-dim); position: static; border: 0; }
  .bgs button.up:not(.has)::after { display: none; }
  .thumbs button.up.has { border-style: solid; display: block; }
  .bgs button.up img { object-position: center; }
  #side { flex: 1; }

  footer p { margin: 0; padding: 20px 0 40px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12px; text-align: center; }
  /* GitHub link: a small button in the page's own style (like 複製圖片), tinted with the accent blue */
  footer a { display: inline-flex; align-items: center; gap: 6px; margin: 0 4px; padding: 4px 12px; border-radius: var(--r-sm);
             vertical-align: middle; background: rgba(106, 168, 247, .12); border: 1px solid rgba(106, 168, 247, .38);
             box-shadow: 0 1px 0 rgba(0, 0, 0, .5); color: var(--accent-soft); font-weight: 700; text-decoration: none;
             transition: background 120ms var(--ease), border-color 120ms var(--ease); }
  footer a svg { width: 15px; height: 15px; fill: currentColor; }
  footer a:hover, footer a:focus-visible { background: rgba(106, 168, 247, .2); border-color: rgba(106, 168, 247, .6); }
  footer a:active { transform: translateY(1px); box-shadow: none; }

  .note.mobile-tip { display: none; }
  @media (max-width: 980px) {
    main { grid-template-columns: minmax(0, 1fr); }   /* the template row scrolls instead of widening the page */
    .preview { position: static; }
    .thumbs:not(.bgs) { grid-template-columns: repeat(6, 1fr); }
  }
  @media (max-width: 560px) {
    .thumbs:not(.bgs) { grid-template-columns: repeat(4, 1fr); }
  }
  /* touch devices: larger slider thumbs and checkboxes for easy thumb control */
  @media (pointer: coarse) {
    input[type=range] { height: 32px; margin-top: 4px; }
    input[type=range]::-webkit-slider-thumb { width: 24px; height: 24px; }
    input[type=checkbox] { width: 20px; height: 20px; }
    label.check { min-height: 36px; }
  }
  /* phone: preview pinned at top, templates in 1 compact row, export docked to thumb bar at bottom */
  @media (max-width: 700px) {
    .rail { padding: 0 12px; }
    header { position: static; height: 42px; }
    .brand-title { font-size: 20px; }
    .brand-sub { display: none; }
    header .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; gap: 8px;
                      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
                      background: rgba(16, 17, 20, .94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
                      border-top: 1px solid var(--border-strong); }
    header .actions button { flex: 1; min-height: 44px; font-size: 15px; }
    #msg { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: rgba(26, 29, 33, .95); border: 1px solid var(--border-strong); color: var(--text);
           padding: 6px 14px; border-radius: 999px; font-size: 13px; pointer-events: none; white-space: nowrap; }
    #msg:empty { display: none; }
    main { gap: 10px; padding-top: 0; padding-bottom: 16px; }
    .preview { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 6px 0 4px; }
    .preview .note { display: none; }
    .preview .note.mobile-tip { display: block; font-size: 11px; color: var(--text-dim); }
    .stage-bar { margin-top: 6px; }
    .stage-btns button { min-height: 34px; padding: 6px 12px; font-size: 13px; }
    .tpl-grid { display: flex; overflow-x: auto; gap: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .tpl-grid::-webkit-scrollbar { display: none; }
    .tpl-grid button { flex: 1 0 auto; white-space: nowrap; min-height: 40px; padding: 8px 12px; font-size: 14px; }
    .tabs button { min-height: 44px; font-size: 15px; }
    .tab-body { padding: 14px 12px; }
    .row > button, .seg button { min-height: 42px; font-size: 14px; }
    .row > button { white-space: nowrap; padding-left: 8px; padding-right: 8px; }   /* 「上傳背景」 stays on one line */
    .colors button { min-width: 50px; min-height: 40px; font-size: 15px; }
    details.more summary { min-height: 36px; font-size: 13px; }
    footer p { padding: 16px 0 calc(84px + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* phones: the finished picture, to long-press and save or copy */
  #sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
           padding: 16px; background: rgba(0,0,0,.94); }
  #sheet[hidden] { display: none; }
  .sheet-box { width: min(720px, 100%); display: flex; flex-direction: column; gap: 12px; }
  #sheetTip { margin: 0; color: var(--text); font-size: 15px; line-height: 1.6; }
  #sheetImg { width: 100%; border-radius: var(--r-sm); -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  .sheet-box .row { display: flex; gap: 8px; }
  .sheet-box .row button { flex: 1; padding: 12px; font-size: 15px; }
  .sheet-box [hidden] { display: none; }
</style>
</head>
<body>
<header>
  <div class="rail">
    <h1 class="brand-title" aria-label="豪老師梗圖產生器"><span class="brand-a">hao</span><span class="brand-b">meme</span></h1>
    <span class="brand-sub">豪老師梗圖產生器</span>
    <div class="actions">
      <span id="msg"></span>
      <button id="copy">複製圖片</button>
      <button class="primary" id="dl">下載 PNG</button>
    </div>
  </div>
</header>

<main class="rail">
  <div class="preview">
    <div class="stage">
      <canvas id="cv" width="1280" height="720"></canvas>
      <canvas id="ov" width="1280" height="720"></canvas>
    </div>
    <div class="stage-bar">
      <p class="note">點選文字、筆刷、人像或背景可拖曳縮放，雙擊文字改字。</p>
      <p class="note mobile-tip">點選元素可拖曳・雙指縮放</p>
      <div class="stage-btns">
        <button id="undo" disabled title="復原 (Ctrl+Z)">復原</button>
        <button id="resetPos" title="重設所有位置與大小">重設位置</button>
      </div>
    </div>
    <p class="note dim">1280×720 輸出・人像源自「拆書人」封面，僅供私下玩梗。</p>
  </div>

  <section class="panel">
    <div class="tpl-grid" id="tpl" role="group" aria-label="版型">
      <button data-v="teach">教育我了？</button>
      <button data-v="crash">翻車了？</button>
      <button data-v="nope">免談</button>
      <button data-v="sue">律師傳票</button>
    </div>

    <div class="card">
      <div class="tabs" id="tabs" role="tablist">
        <button role="tab" aria-selected="true" class="on" data-tab="text">大字</button>
        <button role="tab" aria-selected="false" data-tab="portrait">人像</button>
        <button role="tab" aria-selected="false" data-tab="bg">背景</button>
      </div>

      <div class="tab-body" data-panel="text" role="tabpanel">
        <div class="ed-wrap">
          <div id="edMirror" aria-hidden="true"></div>
          <textarea id="ed" spellcheck="false" aria-label="大字內容"></textarea>
        </div>
        <div class="row colors">
          <span>選字上色</span>
          <button data-c="white" class="k-white">白</button>
          <button data-c="yellow" class="k-yellow">黃</button>
          <button data-c="red" class="k-red">紅</button>
        </div>
        <small>換行會自動排版，選取文字可以換色</small>
        <div id="kbColors" class="row colors" hidden>
          <span>上色</span>
          <button data-c="white" class="k-white">白</button>
          <button data-c="yellow" class="k-yellow">黃</button>
          <button data-c="red" class="k-red">紅</button>
          <button id="kbDone" type="button">完成</button>
        </div>
        <div class="row checks">
          <label class="check"><input type="checkbox" id="brush" checked> 紅色筆刷</label>
          <label class="check"><input type="checkbox" id="italic"> 斜體</label>
        </div>
        <details class="more">
          <summary>進階微調</summary>
          <div class="row checks">
            <label class="check"><input type="checkbox" id="brushFront"> 筆刷在人像前</label>
          </div>
          <label>文字大小 <input type="range" id="tsize" min="30" max="220" value="100"></label>
          <label>文字旋轉 <span id="trotv">0°</span> <input type="range" id="trot" min="-180" max="180" value="0"></label>
          <label>筆刷大小 <input type="range" id="brsize" min="30" max="250" value="100"></label>
        </details>
      </div>

      <div class="tab-body" data-panel="portrait" role="tabpanel" hidden>
        <div class="thumbs" id="thumbs"></div>
        <div class="row">
          <button id="rand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>隨機換一張</button>
          <button id="upBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>上傳照片</button>
          <input type="file" id="up" accept="image/*" hidden>
        </div>
        <div class="row">
          <span>位置</span>
          <div class="seg" id="side">
            <button data-v="left">左</button>
            <button data-v="right">右</button>
          </div>
          <label class="check" style="margin:0"><input type="checkbox" id="flip"> 翻轉</label>
        </div>
        <label>人像大小 <input type="range" id="psize" min="30" max="260" value="100"></label>
      </div>

      <div class="tab-body" data-panel="bg" role="tabpanel" hidden>
        <div class="thumbs bgs" id="bgs"></div>
        <div class="row">
          <button id="bgBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>上傳背景</button>
          <button id="bgFill">填滿</button>
          <button id="bgFit">完整顯示</button>
          <input type="file" id="bg" accept="image/*" hidden>
        </div>
        <label>背景虛化 <input type="range" id="bblur" min="0" max="30" value="0"></label>
        <label>背景大小 <input type="range" id="bsize" min="10" max="300" value="100"></label>
        <label class="check"><input type="checkbox" id="bgBlurFill" checked> 自動補滿邊緣</label>
      </div>
    </div>
  </section>
</main>

<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="儲存圖片">
  <div class="sheet-box">
    <p id="sheetTip"></p>
    <img id="sheetImg" alt="做好的梗圖">
    <div class="row">
      <button class="primary" id="sheetShare">分享或儲存</button>
      <button id="sheetClose">關閉</button>
    </div>
  </div>
</div>

<footer class="rail">

<script>
"use strict";
const W = 1280, H = 720;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const FONT = '"Hao Title", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif';
const tplFont = () => (state.tpl === "sue" ? '"Hao Sue", ' : "") + FONT;   // the letters of the current template

// tx/ty, pdx/pdy and bgx/bgy are how far the text block, the portrait and the
// background were dragged from their default spots; textQuad is where the text
// block landed on screen and textPivot the point it rotates around.
// text is the headline (lines split by \n); cols holds one colour per character.
const state = { tpl: "teach", backdrop: "red", portrait: 0, side: "left", custom: null, upPortrait: null, bg: null, upBg: null, imgs: [],
                tx: 0, ty: 0, pdx: 0, pdy: 0, bgx: 0, bgy: 0, brx: 0, bry: 0, textQuad: null, textPivot: null, brushQuad: null,
                text: "", cols: [] };

// ---------- deterministic random (so the brush doesn't flicker on redraw) ----------
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

// ---------- backgrounds ----------
function coverImage(img, blur) {
  const r = Math.max(W / img.width, H / img.height) * 1.06;
  const w = img.width * r, h = img.height * r;
  ctx.save();
  if (blur) ctx.filter = `blur(${blur}px)`;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  ctx.restore();
}

// an uploaded background at size 100 fills the frame (cover)
const bgCover = img => Math.max(W / img.width, H / img.height) * 1.06;
// size value at which the whole uploaded image fits inside the frame
const bgFitSize = img => Math.min(W / img.width, H / img.height) / bgCover(img) * 100;

// the background as a box that can be moved and scaled like the other pieces;
// an uploaded image keeps its own shape, so it can be shrunk to show all of it
function bgBox() {
  const k = $("bsize").value / 100;
  const [bw, bh] = state.bg ? [state.bg.width * bgCover(state.bg), state.bg.height * bgCover(state.bg)] : [W, H];
  const w = bw * k, h = bh * k;
  return { x: W / 2 + state.bgx - w / 2, y: H / 2 + state.bgy - h / 2, w, h, k };
}
function setBgFit(fit) {
  state.bgx = state.bgy = 0;
  $("bsize").value = fit && state.bg ? bgFitSize(state.bg) : 100;
  render();
}

// built-in backgrounds; each template starts on its own one
const BACKDROPS = [["red", "紅光"], ["grey", "灰牆"], ["smoke", "藍霧燈條"], ["dark", "暗色"], ["room", "灰色房間"]];
const TPL_BG = { teach: "red", crash: "grey", nope: "dark", sue: "room" };
const TPL_PORTRAIT = { teach: "A", crash: "C", nope: "F", sue: "N" };
const bgPhotos = {};                                   // photo backgrounds from backgrounds.js, by key
const brushImgs = {};                                  // painted strokes from backgrounds.js, by template

// a soft round light, squashed to rx x ry (gradients only: Safari has no canvas blur)
function glow(g, x, y, rx, ry, rgb, a) {
  g.save();
  g.translate(x, y); g.scale(1, ry / rx);
  const b = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  b.addColorStop(0, `rgba(${rgb},${a})`); b.addColorStop(.5, `rgba(${rgb},${a * .45})`); b.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = b; g.fillRect(-rx, -rx, rx * 2, rx * 2);
  g.restore();
}

function paintBackdrop(g, kind, personCx) {           // drawn in a W x H space
  if (kind === "red") {
    g.fillStyle = "#0b0b0c"; g.fillRect(0, 0, W, H);
    const b = g.createRadialGradient(personCx, 250, 40, personCx, 300, 640);
    b.addColorStop(0, "#ff1616"); b.addColorStop(.28, "#d40b10"); b.addColorStop(.55, "#6a0508");
    b.addColorStop(.8, "#1c0a0b"); b.addColorStop(1, "#0b0b0c");
    g.fillStyle = b; g.fillRect(0, 0, W, H);
  } else if (kind === "grey") {
    const b = g.createLinearGradient(0, 0, W, H);
    b.addColorStop(0, "#5e6f7f"); b.addColorStop(.48, "#25313e"); b.addColorStop(1, "#0a0f15");
    g.fillStyle = b; g.fillRect(0, 0, W, H);
    // subtle cool studio/screen glow on the right + soft out-of-focus room bokeh
    glow(g, 1060, 180, 420, 260, "74,148,230", .26);
    glow(g, 220, 140, 340, 240, "190,210,230", .16);
    const r = rng(7);
    for (let i = 0; i < 16; i++) {
      const x = r() * W, y = r() * H, rad = 60 + r() * 160;
      const c = g.createRadialGradient(x, y, 0, x, y, rad);
      c.addColorStop(0, `rgba(${150 + r() * 80},${180 + r() * 60},255,${.05 + r() * .09})`);
      c.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = c; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
  } else if (kind === "dark") {
    // a dim room far out of focus: warm window light top left, bright doorway
    // top right, and darkest in the middle where the headline goes
    g.fillStyle = "#120f0c"; g.fillRect(0, 0, W, H);
    glow(g, 110, 80, 360, 250, "205,184,152", .56);
    glow(g, 1140, 115, 165, 310, "236,228,214", .58);
    glow(g, 1110, 640, 360, 170, "118,96,74", .48);
    glow(g, 60, 620, 260, 200, "86,74,62", .5);
    glow(g, 760, 360, 560, 340, "0,0,0", .9);
  } else {
    const im = bgPhotos[kind];

}
function drawBackdrop(personCx) {
  if (state.bg) { coverImage(state.bg, state.tpl === "crash" ? 5 : 0); return; }
  paintBackdrop(ctx, state.backdrop, personCx);
}

// Cache the finished background layer so dragging text or portraits doesn't
// recompute heavy blur / edge-extension passes every frame.
const bgCacheCv = Object.assign(document.createElement("canvas"), { width: W, height: H });
const bgCacheCtx = bgCacheCv.getContext("2d");
let bgCacheKey = "";
function invalidateBgCache() { bgCacheKey = ""; }
drawBackground.ids = 0;

function drawBackground(personCx) {
  const blur = +$("bblur").value;
  const fillEdges = $("bgBlurFill").checked;
  // each uploaded picture gets its own number (two photos of the same size must not share the cache)
  const bgId = state.bg ? "up:" + (state.bg.cacheId ||= ++drawBackground.ids) : "bd:" + state.backdrop;
  const cxKey = !state.bg && state.backdrop === "red" ? Math.round(personCx) : 0;
  const key = [bgId, state.tpl === "crash" && !!state.bg, Math.round(state.bgx), Math.round(state.bgy),

  drawBgBox(b, personCx);

  // past its own edges: the part that is showing is flipped over each edge like
  // a reflection (so colours meet exactly at the seam, and nothing is repeated
  // as a second, enlarged copy);

  const gaps = b.x > 0.5 || b.y > 0.5 || b.x + b.w < W - 0.5 || b.y + b.h < H - 0.5;
  if ($("bgBlurFill").checked && gaps && vw > 4 && vh > 4) {
    const M = 80;                                    // spare rim so the blur has something to read at the frame edge
    const mk = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });
    const buf = drawBackground.buf || (drawBackground.buf = mk(W, H));
    const ext = drawBackground.ext || (drawBackground.ext = mk(W + 2 * M, H + 2 * M));
    const bctx = buf.getContext("2d"), ectx = ext.getContext("2d");
    bctx.clearRect(0, 0, W, H); bctx.drawImage(cv, 0, 0);

    const tw = Math.max(vw, 64), th = Math.max(vh, 64);
    ectx.setTransform(1, 0, 0, 1, 0, 0);
    ectx.clearRect(0, 0, ext.width, ext.height);
    const i0 = Math.floor((-M - vx0) / tw), i1 = Math.floor((W + M - vx0) / tw);
    const j0 = Math.floor((-M - vy0) / th), j1 = Math.floor((H + M - vy0) / th);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {

                        M + vx0 + (i + fx) * tw, M + vy0 + (j + fy) * th);

    // visible seam; it gets blurrier and a bit darker the farther out it goes
    const fog = drawBackground.fog || (drawBackground.fog = mk(W, H));
    const fctx = fog.getContext("2d");
    fctx.globalCompositeOperation = "source-over";
    fctx.clearRect(0, 0, W, H);
    fctx.filter = "blur(22px)";
    fctx.drawImage(ext, -M, -M);
    fctx.filter = "none";
    fctx.fillStyle = "rgba(0,0,0,.18)"; fctx.fillRect(0, 0, W, H);
    fctx.globalCompositeOperation = "destination-out";   // feathered hole over the picture
    fctx.filter = "blur(16px)";
    fctx.fillStyle = "#000"; fctx.fillRect(vx0 - 24, vy0 - 24, vw + 48, vh + 48);
    fctx.filter = "none";
    ctx.drawImage(ext, -M, -M);
    ctx.drawImage(fog, 0, 0);
    ctx.drawImage(buf, vx0, vy0, vw, vh, vx0, vy0, vw, vh);     // the sharp background back on top
  }

  drawFrameShade();

}

// blur everything drawn so far (the background), out of focus like a camera.
// The frame's edge pixels are stretched outward first, so the blur doesn't
// pull black in from beyond the edge.
function blurFrame(px) {

  const p = pad.getContext("2d");
  p.drawImage(cv, m, m);
  p.drawImage(cv, 0, 0, W, 1, m, 0, W, m);                   // top, bottom, left, right
  p.drawImage(cv, 0, H - 1, W, 1, m, m + H, W, m);
  p.drawImage(cv, 0, 0, 1, H, 0, m, m, H);
  p.drawImage(cv, W - 1, 0, 1, H, m + W, m, m, H);
  p.drawImage(cv, 0, 0, 1, 1, 0, 0, m, m);                   // corners
  p.drawImage(cv, W - 1, 0, 1, 1, m + W, 0, m, m);
  p.drawImage(cv, 0, H - 1, 1, 1, 0, m + H, m, m);

    // halving one step at a time so the result stays smooth

      const k = Math.min(2, target / f); f *= k;
      w = Math.max(1, Math.round(w / k)); h = Math.max(1, Math.round(h / k));
      const c = blurFrame.steps[i] || (blurFrame.steps[i] = document.createElement("canvas"));
      c.width = w; c.height = h;
      const g = c.getContext("2d"); g.imageSmoothingQuality = "high";

// the background itself, inside its own box (everything else is left black)
function drawBgBox(b, personCx) {
  if (state.bg) {
    ctx.save();
    if (state.tpl === "crash") ctx.filter = "blur(5px)";
    ctx.drawImage(state.bg, b.x, b.y, b.w, b.h);
    ctx.restore();
  } else {
  ctx.save();
  ctx.translate(b.x, b.y); ctx.scale(b.k, b.k);
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawBackdrop(personCx);
  ctx.restore();
  }
}

// shading that belongs to the frame, not to the background, so it stays put
function drawFrameShade() {
  if (state.bg) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgba(0,0,0,.15)"); g.addColorStop(1, "rgba(0,0,0,.45)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else if (state.backdrop !== "room") {              // the grey room is a photo with its own light: left as it is
    const v = ctx.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 800);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.55)");
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
}

// ---------- portrait ----------
function currentPortrait() {
  return state.custom || state.imgs[state.portrait];
}

// The built-in portraits were widened so both shoulders exist (for flipping).
// `anchor` is where the original cutout sits inside the widened image: the
// portrait is sized and placed by that box, so by default the extra shoulder
// runs off the frame edge just like the original cut did.
function portraitBox() {
  const img = currentPortrait();
  if (!img || !img.naturalWidth) return null;        // not loaded yet
  const meta = state.custom ? null : PORTRAITS[state.portrait];
  const a = (meta && meta.anchor) || { x: 0, y: 0, w: img.width, h: img.height };
  const scale = (H * 0.98 / a.h) * ($("psize").value / 100);
  const w = img.width * scale, h = img.height * scale;
  const ax = $("flip").checked ? img.width - a.x - a.w : a.x;   // box left edge as drawn
  const dx = state.pdx, dy = state.pdy;

// a spot on the head's outline a little below the crown, on both sides, and the head's
// width there, in canvas pixels; worked out once per picture from its transparency.
// null when there is no portrait or it has no see-through background (an uploaded photo)
const headCache = new WeakMap();

      if (l < 0) continue;
      if (r - l > n * .9) break;                       // solid from edge to edge: no cut-out
      top = y; cx = (l + r) >> 1;

    if (!solid(cx, y)) continue;
    let l = cx, r = cx;                                  // the run of the head under the crown, not a hand beside it

  const x = v => b.x + (flip ? b.img.width - v : v) * k;

function drawPortrait(b, ctx = cv.getContext("2d"), bare = false) {   // bare: no drop shadow
  if (!b) return;
  ctx.save();
  if (!bare) {
    ctx.shadowColor = state.backdrop === "red" && !state.bg ? "rgba(40,0,0,.58)" : "rgba(0,0,0,.52)";
    ctx.shadowBlur = 16;
  }
  if ($("flip").checked) {
    ctx.translate(b.x + b.w, b.y); ctx.scale(-1, 1);
    ctx.drawImage(b.img, 0, 0, b.w, b.h);
  } else {
    ctx.drawImage(b.img, b.x, b.y, b.w, b.h);
  }
  ctx.restore();

// ---------- red brush ----------
// The stroke is computed pixel by pixel instead of drawn as a path: a smooth
// body shape, multiplied by a "paint coverage" test against streaky noise

const brushCache = new Map();

    flip: $("flip").checked, bgBlurFill: $("bgBlurFill").checked,
  };
}
function sameSnap(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function syncUndoBtn() { $("undo").disabled = undoStack.length <= 1; }
let typedAt = 0;                                       // when typing last took an undo step (0: something else did)
function pushUndo() {
  typedAt = 0;
  const s = snapshot();
  if (undoStack.length && sameSnap(undoStack[undoStack.length - 1], s)) return;
  undoStack.push(s);
  if (undoStack.length > 30) undoStack.shift();
  syncUndoBtn();
}
// typing: keystrokes without a pause of a second or more make one undo step, taken
// as they happen, so undoing a later drag never takes the typed words with it
function pushTypedUndo() {
  const t = Date.now();
  if (t - typedAt < 1000 && undoStack.length > 1) undoStack.pop();
  pushUndo(); typedAt = t;
}
function undo() {
  if (undoStack.length <= 1) return;
  typedAt = 0;
  undoStack.pop();
  const s = undoStack[undoStack.length - 1];
  Object.assign(state, {
    tpl: s.tpl, backdrop: s.backdrop, portrait: s.portrait, side: s.side,
    tx: s.tx, ty: s.ty, pdx: s.pdx, pdy: s.pdy, bgx: s.bgx, bgy: s.bgy, brx: s.brx, bry: s.bry,
  });
  setText(s.text, s.cols.slice());
  $("tsize").value = s.tsize; $("brsize").value = s.brsize; $("psize").value = s.psize;
  $("bsize").value = s.bsize; $("bblur").value = s.bblur; $("trot").value = s.trot;
  $("brush").checked = s.brush; $("italic").checked = s.italic; $("brushFront").checked = s.brushFront;
  $("flip").checked = s.flip; $("bgBlurFill").checked = s.bgBlurFill;
  syncTpl(); syncSide(); syncThumbs(); syncBgs(); syncUndoBtn();
  ensureFonts(); render();
}

// ---------- tabs ----------
function switchTab(name) {
  document.querySelectorAll("#tabs button").forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle("on", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  document.querySelectorAll("[data-panel]").forEach(p => { p.hidden = p.dataset.panel !== name; });
}
function initTabs() {
  $("tabs").addEventListener("click", e => {
    const t = e.target.dataset && e.target.dataset.tab;
    if (t) switchTab(t);
  });
}

// ---------- on-demand WOFF2 chunk loading ----------
let fontReqId = 0;
function ensureFonts() {
  if (!document.fonts || !document.fonts.load) return;
  const id = ++fontReqId;
  const sample = (state.text || "輪到你教") + "教";
  document.fonts.load(`900 100px ${tplFont()}`, sample).then(() => {
    if (id !== fontReqId) return;
    cloudCache.clear();
    redrawSoon();
  });
}

// ---------- UI ----------
function seg(id, key) {
  const box = $(id);
  const sync = () => box.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === state[key]));
  box.addEventListener("click", e => {
    const v = e.target.dataset && e.target.dataset.v;
    if (!v || v === state[key]) return;
    const prev = state[key];
    state[key] = v;
    if (key === "tpl") applyTemplateDefaults(prev);
    if (key === "side") mirrorForSide();
    sync(); pushUndo(); render();
  });
  sync();
  return sync;
}

// sample headline per template: lines and the colour of each line
const PRESET = {
  teach: [["輪到你", "white"], ["教育我了？", "yellow"]],
  crash: [["AI教育", "white"], ["翻車了？", "yellow"]],
  nope: [["想玩GTA6？", "white"], ["免談", "yellow"]],
  sue: [["你準備收", "white"], ["律師傳票", "yellow"]],
};
function presetText(tpl) { return PRESET[tpl].map(l => l[0]).join("\n"); }
function setText(text, cols) {
  state.text = text; state.cols = cols;
  $("ed").value = text;
  paintEditor();
}
function usePreset(tpl) {
  const cols = [];
  PRESET[tpl].forEach(([t, c], i) => { for (let j = 0; j < t.length + (i < PRESET[tpl].length - 1 ? 1 : 0); j++) cols.push(c); });
  setText(presetText(tpl), cols);
}
function portraitIdxByKey(key) { return PORTRAITS.findIndex(p => p.key === key); }
function applyTemplateDefaults(prev) {
  // only swap the sample text if the user hasn't typed their own,
  // the background only if it is still the old template's own,
  // and the portrait only if it is still the old template's own
  if (Object.keys(PRESET).some(k => presetText(k) === state.text)) usePreset(state.tpl);
  if (state.backdrop === TPL_BG[prev]) { state.backdrop = TPL_BG[state.tpl]; syncBgs(); }
  const prevPi = portraitIdxByKey(TPL_PORTRAIT[prev]), nextPi = portraitIdxByKey(TPL_PORTRAIT[state.tpl]);
  if (!state.custom && state.portrait === prevPi && nextPi >= 0) {
    state.portrait = nextPi;
    state.side = PORTRAITS[nextPi].side;
    $("flip").checked = false;
    state.pdx = state.pdy = 0; $("psize").value = 100;
    syncThumbs(); syncSide();
  }
  $("italic").checked = state.tpl === "crash";        // the crash covers lean; the others stand up
  ensureFonts();
}

// ---------- headline box ----------
// The textarea does the editing; the mirror behind it shows the same text in colour.
function paintEditor() {
  const m = $("edMirror"), t = state.text;
  m.textContent = "";
  for (let i = 0; i < t.length;) {
    let j = i;
    while (j < t.length && state.cols[j] === state.cols[i]) j++;
    const sp = document.createElement("span");
    sp.className = "k-" + (state.cols[i] || "white");
    sp.textContent = t.slice(i, j);
    m.append(sp);
    i = j;
  }
  m.append("​");                                   // keeps a trailing empty line its height
  const ed = $("ed");
  ed.style.height = "auto"; ed.style.height = ed.scrollHeight + 2 + "px";
}
function initEditor() {
  const ed = $("ed");
  ed.addEventListener("input", () => {
    // work out what was typed or deleted; new characters take the colour of
    // the character before them (or after them at the start of a line)
    const o = state.text, n = ed.value;
    let a = 0;
    while (a < o.length && a < n.length && o[a] === n[a]) a++;
    let z = 0;
    while (z < o.length - a && z < n.length - a && o[o.length - 1 - z] === n[n.length - 1 - z]) z++;
    const near = a > 0 && o[a - 1] !== "\n" ? state.cols[a - 1] : (state.cols[a] || state.cols[a - 1] || "white");
    state.cols = state.cols.slice(0, a).concat(Array(n.length - a - z).fill(near), state.cols.slice(o.length - z));
    state.text = n;
    paintEditor(); render(); ensureFonts(); pushTypedUndo();
  });
  // the last selection made in the box: a phone may drop it once the box loses focus
  let sel = [0, 0];
  const keepSel = () => { if (document.activeElement === ed) sel = [ed.selectionStart, ed.selectionEnd]; };
  document.addEventListener("selectionchange", keepSel);
  ed.addEventListener("keyup", keepSel); ed.addEventListener("pointerup", keepSel);

  // phones: a colour bar sits right above the on-screen keyboard while the box is in use
  const bar = $("kbColors"), vv = window.visualViewport;
  const phone = matchMedia("(pointer: coarse)").matches && navigator.maxTouchPoints > 0;
  const placeBar = () => {
    if (bar.hidden) return;
    const bottom = vv ? vv.offsetTop + vv.height : innerHeight;
    bar.style.top = bottom - bar.offsetHeight + "px";
  };
  if (phone) {
    ed.addEventListener("focus", () => { bar.hidden = false; placeBar(); });
    ed.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== ed) bar.hidden = true; }, 0));
    if (vv) { vv.addEventListener("resize", placeBar); vv.addEventListener("scroll", placeBar); }
  }

  document.querySelectorAll(".colors button[data-c]").forEach(b => {
    b.addEventListener("mousedown", e => e.preventDefault());   // keep the selection in the text box
    // on a touch screen the tap would take focus from the box (closing the keyboard
    // and the bar), so the colour is put on as the finger lands instead
    b.addEventListener("touchstart", e => { e.preventDefault(); paint(b.dataset.c); }, { passive: false });
    b.addEventListener("click", () => paint(b.dataset.c));
  });
  $("kbDone").addEventListener("click", () => ed.blur());
  function paint(c) {
    {                                                   // colour the selection
      let [a, z] = document.activeElement === ed ? [ed.selectionStart, ed.selectionEnd] : sel;
      if (a === z) {                                    // nothing selected: colour the caret's line
        const t = state.text;
        a = t.lastIndexOf("\n", a - 1) + 1;
        z = t.indexOf("\n", z); if (z < 0) z = t.length;
      }
      for (let i = a; i < z; i++) state.cols[i] = c;
      paintEditor(); pushUndo(); render();
    }
  }
}

// Moving a built-in portrait to the other side mirrors it, so the person still looks
// and gestures toward the words. Not the hoodie (J): its logo would read backwards.
// An uploaded photo is left as it is (it may have writing on it); 翻轉 is there for it.
const KEEP_UNFLIPPED = new Set(["J"]);
function mirrorForSide() {
  if (state.custom || KEEP_UNFLIPPED.has(PORTRAITS[state.portrait]?.key)) return;
  $("flip").checked = !$("flip").checked;
}

function selectPortrait(i) {
  state.portrait = i; state.custom = null;
  state.side = PORTRAITS[i].side;
  $("flip").checked = false;
  state.pdx = state.pdy = 0; $("psize").value = 100;
  syncThumbs(); syncSide(); pushUndo(); render();
}
function syncThumbs() {
  document.querySelectorAll("#thumbs button").forEach((b, i) =>
    b.classList.toggle("on", b.id === "upThumb" ? !!state.custom : !state.custom && i === state.portrait));
}

function loadFile(file, cb) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => cb(im); im.src = fr.result; };
  fr.readAsDataURL(file);
}

let paintTiles = () => {};
function syncBgs() {
  document.querySelectorAll("#bgs button").forEach(b =>
    b.classList.toggle("on", b.dataset.v ? !state.bg && b.dataset.v === state.backdrop : !!state.bg));
}
// a tall or square picture starts fully visible; a wide one fills the frame
function useUploadedBg() {
  state.bg = state.upBg; syncBgs(); setBgFit(state.bg.width / state.bg.height < 1.2);
}
function initBackdrops() {
  const tiles = BACKDROPS.map(([key, label]) => {
    const b = document.createElement("button");
    b.dataset.v = key; b.title = label; b.setAttribute("aria-label", label);
    const c = document.createElement("canvas"); c.width = 160; c.height = 90;
    b.append(c);
    b.addEventListener("click", () => { state.bg = null; $("bg").value = ""; state.backdrop = key; syncBgs(); pushUndo(); setBgFit(false); });
    $("bgs").append(b);
    return { key, c };
  });
  // the last tile stays empty until a background is uploaded, then shows it
  const up = document.createElement("button");
  up.className = "up"; up.id = "bgUp"; up.title = "上傳背景圖"; up.setAttribute("aria-label", "上傳背景圖");
  up.addEventListener("click", () => state.upBg ? useUploadedBg() : $("bg").click());
  $("bgs").append(up);
  paintTiles = () => tiles.forEach(({ key, c }) => {
    const g = c.getContext("2d");
    g.setTransform(c.width / W, 0, 0, c.height / H, 0, 0);
    paintBackdrop(g, key, W * .25);
  });
  for (const [key, src] of Object.entries(window.BRUSHES || {})) {
    const im = new Image();
    im.onload = redrawSoon;
    im.src = src; brushImgs[key] = im;
  }
  for (const [key, src] of Object.entries(window.BACKGROUNDS || {})) {
    const im = new Image();
    im.onload = () => { invalidateBgCache(); paintTiles(); redrawSoon(); };
    im.src = src; bgPhotos[key] = im;
  }
  paintTiles(); syncBgs();
}

function say(t) { $("msg").textContent = t; clearTimeout(say.t); say.t = setTimeout(() => $("msg").textContent = "", 2500); }

let syncSide, syncTpl;
function init() {
  initTabs();
  initEditor();
  usePreset("teach");
  ["brush", "brushFront", "brsize", "tsize", "trot", "italic", "flip", "psize", "bsize", "bblur"].forEach(id => {
    $(id).addEventListener("input", redrawSoon);
    $(id).addEventListener("change", pushUndo);
  });
  initDirect();
  initBackdrops();
  syncTpl = seg("tpl", "tpl");
  syncSide = seg("side", "side");

  PORTRAITS.forEach((p, i) => {
    const im = new Image(); im.src = p.src; im.onload = redrawSoon;
    state.imgs[i] = im;
    const b = document.createElement("button");
    b.title = p.label;
    const t = new Image(); t.src = p.src; t.alt = p.label; b.append(t);
    b.addEventListener("click", () => selectPortrait(i));
    $("thumbs").append(b);
  });
  // the last tile stays empty until a portrait is uploaded, then shows it
  const up = document.createElement("button");
  up.className = "up"; up.id = "upThumb"; up.title = "上傳自己的"; up.setAttribute("aria-label", "上傳自己的");
  up.addEventListener("click", () => {
    if (!state.upPortrait) return $("up").click();
    state.custom = state.upPortrait; syncThumbs(); render();
  });
  $("thumbs").append(up);
  syncThumbs();

  $("rand").addEventListener("click", () => {
    let i; do { i = Math.floor(Math.random() * PORTRAITS.length); } while (i === state.portrait && !state.custom);
    selectPortrait(i);
  });
  $("upBtn").addEventListener("click", () => $("up").click());
  $("up").addEventListener("change", e => loadFile(e.target.files[0], im => {
    state.upPortrait = state.custom = im;
    const t = new Image(); t.src = im.src; t.alt = "上傳的人像";
    $("upThumb").replaceChildren(t); $("upThumb").classList.add("has");
    syncThumbs(); render();
  }));
  $("bgBtn").addEventListener("click", () => $("bg").click());
  $("bg").addEventListener("change", e => loadFile(e.target.files[0], im => {
    state.upBg = im;
    const t = new Image(); t.src = im.src; t.alt = "上傳的背景";
    $("bgUp").replaceChildren(t); $("bgUp").classList.add("has");
    useUploadedBg();
  }));
  $("bgFill").addEventListener("click", () => setBgFit(false));
  $("bgFit").addEventListener("click", () => setBgFit(true));
  $("bgBlurFill").addEventListener("change", render);

  const fileName = () => (state.text.replace(/\s+/g, "") || "meme").replace(/[\\/:*?"<>|]/g, "") + ".png";
  // built synchronously so iOS still treats the share sheet as part of the tap
  function pngFile() {
    const bin = atob(cv.toDataURL("image/png").split(",")[1]);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new File([buf], fileName(), { type: "image/png" });
  }
  function download(blob) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName();
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  // iPhone / iPad: open the share sheet, whose 「儲存影像」 puts the picture straight into Photos.
  // Android already drops downloads into the gallery, and desktop keeps the plain download.
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const TO_PHOTOS = IOS && !!navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] });
  // Phones are where saving breaks: browsers inside LINE / Discord / Instagram ignore
  // downloads, and Android often "copies" a picture that other apps then can't paste.
  // So on a phone the picture is also shown full size: long-pressing a real image
  // always offers the phone's own 儲存 / 複製, and the share sheet sends it straight to an app.
  const MOBILE = matchMedia("(pointer: coarse)").matches && navigator.maxTouchPoints > 0;
  const INAPP = /Line\/|FBAN|FBAV|FB_IAB|Instagram|Barcelona|Discord|MicroMessenger|KAKAOTALK|; wv\)/i.test(navigator.userAgent);
  const CAN_SHARE = !!navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] });
  function openSheet(tip) {
    $("sheetImg").src = cv.toDataURL("image/png");
    $("sheetTip").textContent = tip + (INAPP ? "（在 LINE、Discord 這類 App 裡開的網頁常常存不了，也可以從右上角選「用瀏覽器開啟」。）" : "");
    $("sheetShare").hidden = !CAN_SHARE;
    $("sheet").hidden = false;
  }
  const closeSheet = () => { $("sheet").hidden = true; $("sheetImg").removeAttribute("src"); };
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  $("sheetShare").addEventListener("click", async () => {
    try { await navigator.share({ files: [pngFile()] }); } catch (e) {}
  });

  const SHARE_FIRST = TO_PHOTOS && !INAPP;
  if (SHARE_FIRST) $("dl").textContent = "存到照片";
  $("dl").addEventListener("click", async () => {
    if (SHARE_FIRST) {
      const file = pngFile();
      say("選「儲存影像」就會存進照片");
      try { await navigator.share({ files: [file] }); }
      catch (e) { if (e.name !== "AbortError") openSheet("長按圖片，選「加入照片」或「儲存影像」。"); }
      return;
    }
    if (!MOBILE) { cv.toBlob(download, "image/png"); return; }
    if (!INAPP) cv.toBlob(download, "image/png");
    openSheet(INAPP ? "長按圖片，選「儲存圖片」或「下載圖片」。" : "沒有開始下載的話，長按圖片，選「下載圖片」。");
  });
  // hand the clipboard a promise inside the tap itself: Safari refuses a write that starts after an await
  $("copy").addEventListener("click", async () => {
    const blob = new Promise(res => cv.toBlob(res, "image/png"));
    let ok = false;
    try { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); ok = true; say("已複製"); }
    catch (e) { if (!MOBILE) say(`這個瀏覽器不能直接複製，請按${$("dl").textContent}`); }
    if (MOBILE && !(ok && IOS)) openSheet(ok ? "已複製。貼不上的話，長按圖片，選「複製圖片」。" : "長按圖片，選「複製圖片」。");
  });

  pushUndo();
  render();
  // redraw once the heavy font chunks for the initial text are ready
  ensureFonts();
}
init();
</script>
</body>
</html>
